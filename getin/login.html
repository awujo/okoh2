<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Login to your Account - North Bridge Investments | Algorithmic Trading Platform</title>
    <meta name="description" content="Choose from our range of investment plans designed to grow your capital through algorithmic trading in crypto and commodities markets." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo/logo_background.png" />
  <style>
    /* Base Styles */
    :root {
      --primary-color: #4f46e5;
      --error-color: #ef4444;
      --success-color: #10b981;
      --text-color: #111827;
      --light-gray: #f3f4f6;
      --border-color: #d1d5db;
      --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #f9fafb;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container Styles */
    .login-container {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 12px;
      box-shadow: var(--box-shadow);
      overflow: hidden;
      padding: 40px;
    }

    .login-header {
      margin-bottom: 32px;
      text-align: center;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--primary-color);
    }

    .login-header p {
      color: #6b7280;
      font-size: 14px;
    }

    /* Form Styles */
    #loginForm {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }

    input {
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    /* Button Styles */
    #loginBtn {
      margin-top: 8px;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #loginBtn:hover {
      background-color: #4338ca;
    }

    #loginBtn:disabled {
      background-color: #a5b4fc;
      cursor: not-allowed;
    }

    /* Loader Styles */
    .loader {
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast Styles */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }

    .toast {
      padding: 16px 20px;
      margin-bottom: 10px;
      border-radius: 8px;
      color: white;
      display: flex;
      align-items: center;
      box-shadow: var(--box-shadow);
      animation: slideIn 0.3s, fadeOut 0.5s 3s forwards;
      max-width: 350px;
    }

    .toast.success {
      background-color: var(--success-color);
    }

    .toast.error {
      background-color: var(--error-color);
    }

    .toast-icon {
      margin-right: 12px;
      font-size: 20px;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }

    /* Footer Links */
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
    }

    .login-footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-container {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Sign in to access your account</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="loginBtn">
        <span class="loader"></span>
        <span class="btn-text">Sign In</span>
      </button>
    </form>

    <div class="login-footer">
      <a href="forgot_password.html">Forgot password?</a> • <a href="register.html">Create account</a>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // Toast notification function
    function showToast(message, type = 'info') {
      const toastContainer = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      // Add icon based on type
      let icon = '';
      switch(type) {
        case 'success':
          icon = '✓';
          break;
        case 'error':
          icon = '✗';
          break;
        default:
          icon = 'ℹ';
      }
      
      toast.innerHTML = `
        <span class="toast-icon">${icon}</span>
        <span>${message}</span>
      `;
      
      toastContainer.appendChild(toast);
      
      // Remove toast after animation
      setTimeout(() => {
        toast.remove();
      }, 3500);
    }

    // Form submission handler
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const loader = btn.querySelector(".loader");
      const btnText = btn.querySelector(".btn-text");
      
      // Show loading state
      btn.disabled = true;
      loader.style.display = "block";
      btnText.textContent = "Signing in...";

      const formData = new FormData(e.target);

      try {
        const res = await fetch("../api/login.php", {
          method: "POST",
          body: formData
        });
        
        const data = await res.json();
        showToast(data.message, data.status);

        if (data.status === "success") {
          if (data.twoFARequired) {
            window.location.href = "../getin/verify_2fa.html";
          } else {
            window.location.href = "../in/index.html";
          }
        }
      } catch (err) {
        showToast("Network error. Please try again.", "error");
        console.error("Login error:", err);
      } finally {
        // Reset button state
        btn.disabled = false;
        loader.style.display = "none";
        btnText.textContent = "Sign In";
      }
    });

    // Focus email field on page load
    document.addEventListener('DOMContentLoaded', () => {
      const emailField = document.getElementById('email');
      if (emailField) emailField.focus();
    });
  </script>
</body>
</html>
