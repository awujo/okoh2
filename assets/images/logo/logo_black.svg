<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Circle badge -->
  <circle cx="100" cy="62" r="52" fill="none" stroke="#111111" stroke-width="2.5"/>
  <!-- Bar chart bars -->
  <rect x="72" y="73" width="11" height="22" fill="#111111" rx="1.5"/>
  <rect x="87" y="63" width="11" height="32" fill="#111111" rx="1.5"/>
  <rect x="102" y="52" width="11" height="43" fill="#111111" rx="1.5"/>
  <!-- Trend line -->
  <polyline points="70,76 86,64 101,54 118,43" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow head -->
  <polyline points="110,41 118,43 116,51" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- NORTH -->
  <text x="100" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#111111" letter-spacing="5">NORTH</text>
  <!-- BRIDGE -->
  <text x="100" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#111111" letter-spacing="3">BRIDGE</text>
  <!-- Divider -->
  <line x1="30" y1="178" x2="170" y2="178" stroke="#111111" stroke-width="0.8" opacity="0.6"/>
  <!-- INVESTMENTS -->
  <text x="100" y="195" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#111111" letter-spacing="4" opacity="0.9">INVESTMENTS</text>
</svg>
