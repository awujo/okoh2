<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rectangle -->
  <rect x="0" y="0" width="200" height="60" rx="5" fill="#131722"/>
  
  <!-- Logo icon - Combining graph and blockchain elements -->
  <path d="M15,40 L25,25 L35,35 L45,20 L55,30 L65,15" stroke="#6e8efb" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="15" cy="40" r="3" fill="#6e8efb"/>
  <circle cx="25" cy="25" r="3" fill="#6e8efb"/>
  <circle cx="35" cy="35" r="3" fill="#6e8efb"/>
  <circle cx="45" cy="20" r="3" fill="#6e8efb"/>
  <circle cx="55" cy="30" r="3" fill="#6e8efb"/>
  <circle cx="65" cy="15" r="3" fill="#6e8efb"/>
  
  <!-- Blockchain nodes -->
  <rect x="70" y="15" width="10" height="10" rx="2" fill="#a777e3" opacity="0.8"/>
  <rect x="85" y="25" width="10" height="10" rx="2" fill="#6e8efb" opacity="0.8"/>
  <rect x="70" y="35" width="10" height="10" rx="2" fill="#a777e3" opacity="0.8"/>
  <rect x="85" y="15" width="10" height="10" rx="2" fill="#6e8efb" opacity="0.8"/>
  <rect x="70" y="25" width="10" height="10" rx="2" fill="#a777e3" opacity="0.8"/>
  
  <!-- Connecting lines -->
  <path d="M80,25 L85,25" stroke="#fff" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M80,35 L85,35" stroke="#fff" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M95,25 L100,25" stroke="#fff" stroke-width="1.5" stroke-dasharray="2,2"/>
  
  <!-- Logo text -->
  <text x="110" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">NexoraCapitals</text>
  <text x="110" y="50" font-family="Arial, sans-serif" font-size="12" fill="#6e8efb">Algorithmic Trading</text>
</svg>